name: Verify local MVP
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m simulator.validate
      - run: python -m pytest -q
      - run: python -m evals.run
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8000 > /tmp/why-now-api.log 2>&1 &
          npm --prefix apps/web run start > /tmp/why-now-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          npm --prefix apps/web run test:e2e
